<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love — Cinematic Animation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050006}
body{font-family:Arial,sans-serif}
.scene{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,30,100,.16),transparent 22%),
    radial-gradient(circle at 25% 45%,rgba(255,0,90,.09),transparent 28%),
    radial-gradient(circle at 75% 55%,rgba(180,0,100,.08),transparent 28%),
    #050006;
}
.glow{
  position:absolute;left:50%;top:50%;width:42vmin;height:42vmin;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,20,95,.28),rgba(255,0,70,.06),transparent 70%);
  filter:blur(18px);animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.45);opacity:.75}}

.stars{position:absolute;inset:0}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;background:#ffd1df;
  box-shadow:0 0 8px #ff6b9d;animation:twinkle 2s ease-in-out infinite;
}
@keyframes twinkle{50%{opacity:.15;transform:scale(.35)}}

.orbit{
  position:absolute;left:50%;top:50%;width:min(78vw,900px);height:min(78vw,900px);
  transform:translate(-50%,-50%);border:1px solid rgba(255,70,130,.08);
  border-radius:50%;animation:spin 18s linear infinite;
}
.orbit::after{
  content:"";position:absolute;left:0;top:50%;width:7px;height:7px;border-radius:50%;
  background:#ff5b91;box-shadow:0 0 15px 5px rgba(255,45,110,.65);
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.core{
  position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;
  transform:translate(-50%,-50%);background:white;
  box-shadow:0 0 12px 4px #ff9fbd,0 0 45px 15px rgba(255,0,90,.6);
  animation:corePulse 1.2s ease-in-out infinite;
}
@keyframes corePulse{50%{transform:translate(-50%,-50%) scale(2.5);box-shadow:0 0 20px 7px #ffb5cb,0 0 70px 25px rgba(255,0,90,.75)}}

.lover{
  position:absolute;left:50%;top:50%;width:100vw;height:100vh;
  transform:translate(-50%,-50%);pointer-events:none;
}
.orb{
  position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
  background:#fff;box-shadow:0 0 12px 4px #ffb0c8,0 0 35px 12px #ff2468;
}
.orb.left{left:-20px;animation:meetLeft 6s cubic-bezier(.65,0,.35,1) infinite}
.orb.right{right:-20px;animation:meetRight 6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes meetLeft{
  0%{transform:translateY(-50%) translateX(0);opacity:0}
  12%{opacity:1}
  45%{transform:translateY(-50%) translateX(calc(50vw - 55px))}
  52%{transform:translateY(-50%) translateX(calc(50vw - 7px));opacity:1}
  58%{transform:translateY(-50%) translateX(calc(50vw - 7px));opacity:0}
  100%{opacity:0}
}
@keyframes meetRight{
  0%{transform:translateY(-50%) translateX(0);opacity:0}
  12%{opacity:1}
  45%{transform:translateY(-50%) translateX(calc(-50vw + 55px))}
  52%{transform:translateY(-50%) translateX(calc(-50vw + 7px));opacity:1}
  58%{transform:translateY(-50%) translateX(calc(-50vw + 7px));opacity:0}
  100%{opacity:0}
}

.trail{position:absolute;top:50%;height:2px;width:46vw;transform:translateY(-50%);opacity:.45;
  background:linear-gradient(90deg,transparent,#ff3e78,transparent);filter:blur(1px)}
.trail.left{left:0}.trail.right{right:0;transform:translateY(-50%) rotate(180deg)}

.heartWrap{
  position:absolute;left:50%;top:50%;width:170px;height:170px;
  transform:translate(-50%,-50%) rotate(-45deg);
  opacity:0;animation:heartCycle 6s ease-in-out infinite;
  filter:drop-shadow(0 0 12px #ff1459) drop-shadow(0 0 35px rgba(255,0,80,.8));
}
.heart{
  position:absolute;left:35px;top:35px;width:100px;height:100px;
  background:linear-gradient(135deg,#ff003f,#ff2166,#ff719b);
  border-radius:12px;
}
.heart:before,.heart:after{
  content:"";position:absolute;width:100px;height:100px;border-radius:50%;
  background:inherit;
}
.heart:before{left:0;top:-50px}.heart:after{left:50px;top:0}
@keyframes heartCycle{
  0%,42%{opacity:0;transform:translate(-50%,-50%) rotate(-45deg) scale(.2)}
  48%{opacity:1;transform:translate(-50%,-50%) rotate(-45deg) scale(1)}
  56%{opacity:1;transform:translate(-50%,-50%) rotate(-45deg) scale(1.12)}
  62%{opacity:0;transform:translate(-50%,-50%) rotate(-45deg) scale(2.1)}
  100%{opacity:0}
}

.particle{
  position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
  background:#ffb0c8;box-shadow:0 0 10px 3px #ff286d;
  opacity:0;animation:burst 6s ease-out infinite;
  --x:0px;--y:0px;--s:1;
}
@keyframes burst{
  0%,57%{transform:translate(-50%,-50%) scale(.1);opacity:0}
  60%{opacity:1}
  78%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--s));opacity:.9}
  100%{transform:translate(calc(-50% + var(--x)*1.3),calc(-50% + var(--y)*1.3)) scale(0);opacity:0}
}

.miniHeart{
  position:absolute;left:50%;top:50%;font-size:16px;color:#ff4c85;
  opacity:0;filter:drop-shadow(0 0 7px #ff1459);
  animation:miniBurst 6s ease-out infinite;
  --x:0px;--y:0px;--r:0deg;
}
@keyframes miniBurst{
  0%,58%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}
  63%{opacity:1}
  82%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r));opacity:.9}
  100%{transform:translate(calc(-50% + var(--x)*1.2),calc(-50% + var(--y)*1.2)) scale(.15) rotate(var(--r));opacity:0}
}

.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle,transparent 30%,rgba(0,0,0,.72) 100%)}
</style>
</head>
<body>
<div class="scene">
  <div class="glow"></div>
  <div class="stars" id="stars"></div>
  <div class="orbit"></div>
  <div class="core"></div>
  <div class="trail left"></div><div class="trail right"></div>

  <div class="lover"><div class="orb left"></div><div class="orb right"></div></div>

  <div class="heartWrap"><div class="heart"></div></div>

  <div id="particles"></div>
  <div id="hearts"></div>
  <div class="vignette"></div>
</div>

<script>
const stars=document.getElementById("stars");
for(let i=0;i<120;i++){
  const s=document.createElement("div");s.className="star";
  s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
  s.style.opacity=.15+Math.random()*.75;
  s.style.animationDelay=Math.random()*2+"s";
  s.style.animationDuration=1.2+Math.random()*2.5+"s";
  stars.appendChild(s);
}

const particles=document.getElementById("particles");
for(let i=0;i<90;i++){
  const p=document.createElement("div");p.className="particle";
  const a=Math.random()*Math.PI*2;
  const r=80+Math.random()*360;
  p.style.setProperty("--x",Math.cos(a)*r+"px");
  p.style.setProperty("--y",Math.sin(a)*r+"px");
  p.style.setProperty("--s",(.3+Math.random()*1.5).toFixed(2));
  p.style.animationDelay=(-Math.random()*6)+"s";
  p.style.animationDuration=(5.5+Math.random()*1)+"s";
  particles.appendChild(p);
}

const hearts=document.getElementById("hearts");
for(let i=0;i<35;i++){
  const h=document.createElement("div");h.className="miniHeart";h.textContent="♥";
  const a=Math.random()*Math.PI*2;
  const r=100+Math.random()*330;
  h.style.setProperty("--x",Math.cos(a)*r+"px");
  h.style.setProperty("--y",Math.sin(a)*r+"px");
  h.style.setProperty("--r",(Math.random()*90-45)+"deg");
  h.style.fontSize=(10+Math.random()*14)+"px";
  h.style.animationDelay=(-Math.random()*6)+"s";
  hearts.appendChild(h);
}
</script>
</body>
</html>
